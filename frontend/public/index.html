<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBF7F2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DestinyOne" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="app-root-reset">
      /* Give the app a root exactly as tall as the screen so screens that use
         flex:1 fill it, the bottom nav stays pinned, and only inner scroll
         views scroll (not the whole page). Same as Expo's standard reset. */
      html, body { width: 100%; height: 100%; margin: 0; background-color: #FBF7F2; }
      body { overflow: hidden; }
      #root { display: flex; flex: 1; width: 100%; height: 100%; }

      /* Press feedback for every tappable element. The short delay keeps cards
         still while the finger is only scrolling past them. */
      * { -webkit-tap-highlight-color: transparent; }
      @property --d1-r { syntax: "<length>"; inherits: false; initial-value: 0px; }
      @media (prefers-reduced-motion: no-preference) {
        div[tabindex="0"]:not([role="dialog"]), button, a {
          transition: transform 520ms cubic-bezier(.22,.8,.2,1), box-shadow 520ms cubic-bezier(.22,.8,.2,1);
        }
        div[tabindex="0"]:not([role="dialog"]):active:not(:has(div[tabindex="0"]:active, button:active)),
        button:active:not(:has(div[tabindex="0"]:active, button:active)), a:active {
          transform: scale(.965);
          transition: transform 280ms cubic-bezier(.22,.8,.2,1) 40ms;
        }
        /* Card hover: tilts toward the cursor and lifts, with a gold sheen. */
        [data-d1-tilt] {
          transform: perspective(1000px) rotateX(var(--d1-rx, 0deg)) rotateY(var(--d1-ry, 0deg)) translateY(-8px) scale(1.02) !important;
          box-shadow: 0 28px 54px -20px rgba(124,0,21,.46), 0 0 0 1px rgba(185,138,47,.42) !important;
          transition: transform 300ms ease-out, box-shadow 520ms ease-out !important;
          z-index: 5;
        }
        [data-d1-tilt]::after {
          content: ""; position: absolute; inset: 0; z-index: 9;
          border-radius: inherit; pointer-events: none;
          background: radial-gradient(280px circle at var(--d1-mx, 50%) var(--d1-my, 50%), rgba(244,209,112,.28), rgba(229,9,47,.08) 45%, transparent 72%);
        }
        /* Tap: a wine and gold glow spreads from the finger. */
        [data-d1-ripple]::before {
          content: ""; position: absolute; inset: 0; z-index: 9;
          border-radius: inherit; pointer-events: none;
          background: radial-gradient(circle var(--d1-r) at var(--d1-px, 50%) var(--d1-py, 50%), rgba(244,209,112,.36), rgba(179,12,61,.18) 62%, transparent 74%);
          animation: d1-ripple 950ms cubic-bezier(.22,.8,.2,1) forwards;
        }
        @keyframes d1-ripple {
          from { --d1-r: 0px; opacity: 1; }
          to { --d1-r: var(--d1-rmax, 420px); opacity: 0; }
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Keep the app exactly as tall as the visible area, so when the keyboard
         opens the chat input moves up with it instead of staying hidden below. */
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        var root = document.getElementById("root");
        function sync() {
          var h = Math.round(vv.height) + "px";
          document.documentElement.style.height = h;
          document.body.style.height = h;
          root.style.height = h;
          if (vv.offsetTop || window.scrollY) window.scrollTo(0, 0);
        }
        vv.addEventListener("resize", sync);
        vv.addEventListener("scroll", sync);
        window.addEventListener("orientationchange", function () { setTimeout(sync, 250); });
        sync();
      })();
    </script>
  </body>
</html>
