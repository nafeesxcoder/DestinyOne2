<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBF7F2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DestinyOne" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="app-root-reset">
      /* Give the app a root exactly as tall as the screen so screens that use
         flex:1 fill it, the bottom nav stays pinned, and only inner scroll
         views scroll (not the whole page). Same as Expo's standard reset. */
      html, body { width: 100%; height: 100%; margin: 0; background-color: #FBF7F2; }
      body { overflow: hidden; }
      #root { display: flex; flex: 1; width: 100%; height: 100%; }

      /* Press feedback for every tappable element. The short delay keeps cards
         still while the finger is only scrolling past them. */
      * { -webkit-tap-highlight-color: transparent; }
      @media (prefers-reduced-motion: no-preference) {
        div[tabindex="0"]:not([role="dialog"]), button, a {
          transition: transform 180ms cubic-bezier(.22,1,.36,1);
        }
        div[tabindex="0"]:not([role="dialog"]):active:not(:has(div[tabindex="0"]:active)),
        button:active, a:active {
          transform: scale(.97);
          transition: transform 110ms ease-out 50ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Keep the app exactly as tall as the visible area, so when the keyboard
         opens the chat input moves up with it instead of staying hidden below. */
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        var root = document.getElementById("root");
        function sync() {
          var h = Math.round(vv.height) + "px";
          document.documentElement.style.height = h;
          document.body.style.height = h;
          root.style.height = h;
          if (vv.offsetTop || window.scrollY) window.scrollTo(0, 0);
        }
        vv.addEventListener("resize", sync);
        vv.addEventListener("scroll", sync);
        window.addEventListener("orientationchange", function () { setTimeout(sync, 250); });
        sync();
      })();
    </script>
  </body>
</html>
